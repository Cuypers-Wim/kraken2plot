[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krakenplot"
version = "0.1.0"
description = "A command-line tool for visualising Kraken2 taxonomic classification output"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "KrakenPlot Contributors" }
]
keywords = ["bioinformatics", "metagenomics", "kraken2", "taxonomy", "visualisation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
  "click>=8.1",
  "pandas>=1.5",
  "matplotlib>=3.7",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
]

[project.scripts]
kraken2plot = "krakenplot.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/krakenplot"
"Bug Tracker" = "https://github.com/your-username/krakenplot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["krakenplot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
